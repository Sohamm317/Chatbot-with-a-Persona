<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f8;
  --surface: #ffffff;
  --ink: #1a2038;
  --muted: #5f6783;
  --line: #d9deec;
  --accent: #4a3fd4;
  --accent-ink: #ffffff;
  --bot: #e8ebf7;
  --err-bg: #fde8e8;
  --err-ink: #8a1c1c;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12152a;
    --surface: #1b2040;
    --ink: #e9ecfb;
    --muted: #9aa2c7;
    --line: #2d3560;
    --accent: #8f86ff;
    --accent-ink: #12152a;
    --bot: #262d57;
    --err-bg: #4a1f27;
    --err-ink: #ffc9c9;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
}
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 1100px; height: 100%; margin: 0 auto; padding: 1.25rem;
  display: grid; grid-template-columns: 330px 1fr; gap: 1.25rem;
}

/* ---------- Persona panel ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto;
}
h1 { font-family: var(--display); font-weight: 800; font-size: 1.7rem; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
.sub { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }
label { font-weight: 600; font-size: .92rem; }
textarea {
  width: 100%; resize: vertical; padding: .7rem .8rem; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); min-height: 110px;
}
.count { text-align: right; font-size: .8rem; color: var(--muted); margin-top: .25rem; }
.count.over { color: var(--err-ink); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: .3rem .75rem; font-size: .85rem; cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.primary {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
  padding: .75rem 1rem; font-weight: 700; cursor: pointer;
}
.primary:hover { filter: brightness(1.08); }
.primary:disabled { opacity: .5; cursor: not-allowed; }
.hint { font-size: .85rem; color: var(--muted); min-height: 1.3rem; margin: 0; }

/* ---------- Chat ---------- */
.chat {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.cast {
  display: flex; align-items: center; gap: .8rem; padding: .9rem 1.25rem;
  border-bottom: 1px solid var(--line);
}
.avatar {
  width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 1.2rem; color: #fff; background: var(--muted);
}
.avatar.sm { width: 30px; height: 30px; font-size: .9rem; }
.cast-text { min-width: 0; }
.cast-name { font-weight: 700; }
.cast-desc { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#log { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: .8rem; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 30ch; }
.row { display: flex; gap: .6rem; align-items: flex-end; max-width: 100%; }
.row.user { justify-content: flex-end; }
.bubble {
  padding: .6rem .9rem; border-radius: 16px; max-width: min(75%, 60ch);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.user .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.bot .bubble { background: var(--bot); border-bottom-left-radius: 4px; }
.err .bubble { background: var(--err-bg); color: var(--err-ink); }
.dots { display: inline-flex; gap: 4px; padding: .3rem 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.composer { display: flex; gap: .6rem; padding: .9rem 1.25rem; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { min-height: 44px; max-height: 140px; resize: none; }
.composer textarea:disabled { opacity: .55; }

@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }

@media (max-width: 800px) {
  html, body { height: auto; }
  .app { grid-template-columns: 1fr; height: auto; padding: .75rem; }
  .panel { overflow: visible; }
  .chat { height: 70vh; }
}
</style>
</head>
<body>
<main class="app">

  <section class="panel" aria-label="Persona setup">
    <div>
      <h1>Persona Chat</h1>
      <p class="sub">Describe who the AI should be. Changing the persona starts a new conversation.</p>
    </div>

    <div>
      <label for="persona">Persona</label>
      <textarea id="persona" maxlength="1000"
        placeholder="e.g. A strict but kind gym coach who motivates with short, punchy sentences."></textarea>
      <div class="count" id="count">0 / 1000</div>
    </div>

    <div>
      <label>Quick starts</label>
      <div class="chips" id="chips"></div>
    </div>

    <button class="primary" id="setPersona">Start chat</button>
    <p class="hint" id="hint" role="status"></p>
  </section>

  <section class="chat" aria-label="Conversation">
    <div class="cast">
      <div class="avatar" id="castAvatar">?</div>
      <div class="cast-text">
        <div class="cast-name" id="castName">No persona yet</div>
        <div class="cast-desc" id="castDesc">Write one on the left, or pick a quick start.</div>
      </div>
    </div>

    <div id="log" aria-live="polite">
      <div class="empty" id="empty">Your conversation will appear here once you start a chat.</div>
    </div>

    <div class="composer">
      <textarea id="message" rows="1" maxlength="2000" disabled
        placeholder="Set a persona to begin" aria-label="Message"></textarea>
      <button class="primary" id="send" disabled>Send</button>
    </div>
  </section>

</main>

<script>
const PRESETS = {
  "Pirate Python tutor": "A sarcastic pirate captain who teaches Python. Uses sea slang, keeps explanations short, and ends each answer with a small coding challenge.",
  "Gym coach": "A strict but kind gym coach who motivates with short, punchy sentences and never lets the user make excuses.",
  "Shakespeare": "William Shakespeare, speaking in Early Modern English with dramatic flair, but explaining modern topics clearly.",
  "Calm mentor": "A patient senior developer who asks one guiding question before giving advice and explains with simple analogies."
};

const $ = (id) => document.getElementById(id);
const log = $("log"), personaEl = $("persona"), msgEl = $("message"), sendBtn = $("send");
const hint = $("hint"), countEl = $("count");
let ready = false, busy = false, accent = "hsl(250 55% 50%)";

/* Quick-start chips */
Object.keys(PRESETS).forEach((name) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = name;
  b.onclick = () => { personaEl.value = PRESETS[name]; updateCount(); personaEl.focus(); };
  $("chips").appendChild(b);
});

function updateCount() {
  const n = personaEl.value.length;
  countEl.textContent = n + " / 1000";
  countEl.classList.toggle("over", n >= 1000);
}
personaEl.addEventListener("input", updateCount);

/* Avatar colour + letter derived from the persona text */
function hueFrom(text) {
  let h = 0;
  for (const c of text) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}
function initialFrom(text) {
  const cleaned = text.replace(/^(you are|you're|act as|be)\s+/i, "").replace(/^(a|an|the)\s+/i, "").trim();
  return (cleaned[0] || "?").toUpperCase();
}
function paintAvatar(el, persona) {
  el.textContent = initialFrom(persona);
  el.style.background = "hsl(" + hueFrom(persona) + " 55% 45%)";
}

/* Messages */
function clearLog() { log.innerHTML = ""; }
function addRow(kind, text) {
  const row = document.createElement("div");
  row.className = "row " + kind;
  if (kind !== "user") {
    const av = document.createElement("div");
    av.className = "avatar sm";
    paintAvatar(av, personaEl.dataset.active || "?");
    row.appendChild(av);
  }
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;          // textContent prevents XSS
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}
function addTyping() {
  const row = addRow("bot", "");
  row.querySelector(".bubble").innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  return row;
}

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong. Try again.");
  return data;
}

function setReady(on) {
  ready = on;
  msgEl.disabled = !on;
  sendBtn.disabled = !on;
  msgEl.placeholder = on ? "Type a message. Enter to send, Shift+Enter for a new line." : "Set a persona to begin";
}

/* Set persona */
$("setPersona").onclick = async () => {
  const persona = personaEl.value.trim();
  if (!persona) { hint.textContent = "Write a persona or pick a quick start first."; return; }
  hint.textContent = "Starting chat...";
  try {
    await postJSON("/persona", { persona });
    personaEl.dataset.active = persona;
    paintAvatar($("castAvatar"), persona);
    $("castName").textContent = "Chatting with your persona";
    $("castDesc").textContent = persona;
    clearLog();
    addRow("bot", "I’m ready. Say something!");
    setReady(true);
    hint.textContent = "Persona saved.";
    msgEl.focus();
  } catch (e) {
    hint.textContent = e.message;
  }
};

/* Send */
async function send() {
  const text = msgEl.value.trim();
  if (!text || busy || !ready) return;
  busy = true; sendBtn.disabled = true;
  addRow("user", text);
  msgEl.value = ""; autoGrow();
  const typing = addTyping();
  try {
    const data = await postJSON("/chat", { message: text });
    typing.remove();
    addRow("bot", data.reply);
  } catch (e) {
    typing.remove();
    addRow("err", e.message);
  } finally {
    busy = false; sendBtn.disabled = false; msgEl.focus();
  }
}
sendBtn.onclick = send;
msgEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

/* Auto-growing input */
function autoGrow() {
  msgEl.style.height = "auto";
  msgEl.style.height = Math.min(msgEl.scrollHeight, 140) + "px";
}
msgEl.addEventListener("input", autoGrow);
</script>
</body>
</html>
